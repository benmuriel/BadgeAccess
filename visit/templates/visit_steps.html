<div class="col-4 p-2">
  <div class="container bg-white p-4 rounded shadow-sm" style="max-width: 500px;">
    <h4 class="mb-4 text-center">Progression de l'identification</h4>
    <div class="stepper-vertical mt-4">
      <!-- Étape 1 : Complétée (Bleu) -->
      <div class="step-item">
        <div id="step1"
          class="step-bubble {% if step >= 1 %}
            
            
                
                
                 completed




          {% else %}
            
            
                
                
                 pending




          {% endif %} ">1</div>
        <div class="step-content">
          <h6 class="mb-0 fw-bold text-dark">Présentation de pièce d'identité</h6>
          <small class="text-muted">Pièces en cours de validité</small>
        </div>
      </div>

      <!-- Étape 2 : Complétée (Bleu) -->
      <div class="step-item">
        <div id="step2"
          class="step-bubble  {% if step >= 2 %}
            
            
                
                
                 completed




          {% else %}
            
            
                
                
                 pending




          {% endif %}">2</div>
        <div class="step-content">
          <h6 class="mb-0 fw-bold text-dark">Enregistrement des informations personnelles</h6>
          <small class="text-muted">Information comforme à la pièce d'identité</small>
        </div>
      </div>

      <!-- Étape 3 : Actuelle / En cours (Bleu) -->
      <div class="step-item">
        <div id="step3"
          class="step-bubble   {% if step >= 3 %}
            
            
                
                
                 completed




          {% else %}
            
            
                
                
                 pending




          {% endif %}">3</div>
        <div class="step-content">
          <h6 class="mb-0 fw-bold text-primary">Enregistrement de la visite</h6>
          <small class="text-muted">Objet de visite &amp; Octoire du Badge</small>
        </div>
      </div>
    </div>
  </div>
</div>
